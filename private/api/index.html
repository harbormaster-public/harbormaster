<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harbormaster API</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://unpkg.com/swagger-ui-dist@5.31.0/swagger-ui.css"
    />
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu,
          Cantarell, Noto Sans, sans-serif;
        margin: 0;
      }
      #swagger-ui { margin: 0; }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>

    <script
src="https://unpkg.com/swagger-ui-dist@5.31.0/swagger-ui-bundle.js"
    ></script>
    <script
src="https://unpkg.com/swagger-ui-dist@5.31.0/swagger-ui-standalone-preset.js"
    ></script>
    <script>
      window.onload = function () {
        const ui = SwaggerUIBundle({
          url: '/api/openapi.json?ts=' + Date.now(),
          dom_id: '#swagger-ui',
          deepLinking: true,
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset,
          ],
          plugins: [
            SwaggerUIBundle.plugins.DownloadUrl,
          ],
          layout: 'StandaloneLayout',
        });
        window.ui = ui;
      };
    </script>
  </body>
</html>
