name: Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      # - '**' # Will build for all pushes
      - master

jobs:
  lint:
    name: lint (changed files)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Meteor
        run: |
          curl https://install.meteor.com/ | sh
          echo "$HOME/.meteor" >> $GITHUB_PATH

      - name: Setup build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-setuptools \
            python3-venv

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: |
          meteor npm ci

      - name: Fetch base branch (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Run lint
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            meteor npm run lint:diff -- "origin/${{ github.base_ref }}"
          else
            meteor npm run lint:diff -- "${{ github.event.before }}"
          fi

  tests:
    name: ${{ matrix.suite }} tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Meteor
        run: |
          curl https://install.meteor.com/ | sh
          echo "$HOME/.meteor" >> $GITHUB_PATH

      - name: Setup build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-setuptools \
            python3-venv

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: |
          meteor npm ci

      - name: Run unit/integration tests
        if: matrix.suite == 'unit'
        run: |
          meteor npm run test

      - name: Run e2e tests
        if: matrix.suite == 'e2e'
        run: |
          meteor npm run test:e2e
